name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --global npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Verify version is unpublished
        run: npm run check:version

      - name: Publish to npm
        run: npm publish --access public --provenance
