name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --global npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Verify version is unpublished
        run: npm run check:version

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Configure Homebrew tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY repository secret is not set."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$HOME/.ssh/shh_homebrew_tap"
          chmod 600 "$HOME/.ssh/shh_homebrew_tap"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"

      - name: Update Homebrew formula
        run: |
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/shh_homebrew_tap -o IdentitiesOnly=yes" \
            node scripts/update-homebrew-formula.mjs
